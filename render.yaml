# Render Blueprint — Laravel via Docker (PHP 8.4 + nginx)

databases:
  - name: education-app-db
    plan: free
    databaseName: education_app
    user: education_app
    region: singapore

services:
  - type: web
    name: education-app
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Smart Classroom
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://education-app-myav.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: education-app-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MQTT_ENABLED
        value: false
